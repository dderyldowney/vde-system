# VM Type Configuration File
# Format: type|name|aliases|display_name|install_command|service_port
# service_port is empty for languages

# Language VMs (ports 2200-2299)
lang|vde-c|c|C|apt-get update -y && apt-get install -y gcc make cmake gdb|
lang|vde-cpp|cpp,c++,gcc|C++|apt-get update -y && apt-get install -y g++ make cmake gdb|
lang|vde-asm|asm,assembler,nasm|Assembler|apt-get update -y && apt-get install -y nasm yasm gdb|
lang|vde-python|python,python3,py|Python|apt-get update -y && apt-get install -y python3 python3-pip|
lang|vde-rust|rust|Rust|su devuser -c 'curl --proto '\''=https'\'' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'|
lang|vde-js|js,node,nodejs,javascript|JavaScript|apt-get update && curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - && apt-get install -y nodejs|
lang|vde-csharp|csharp,dotnet|C#|apt-get update -y && apt-get install -y wget apt-transport-https && wget https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb && dpkg -i /tmp/packages-microsoft-prod.deb && rm /tmp/packages-microsoft-prod.deb && apt-get update -y && apt-get install -y dotnet-sdk-8.0 aspnetcore-runtime-8.0|
lang|vde-ruby|ruby|Ruby|apt-get update -y && apt-get install -y ruby-full|
lang|vde-go|go,golang|Go|apt-get update -y && apt-get install -y golang-go|
lang|vde-java|java,jdk|Java|apt-get update -y && apt-get install -y default-jdk maven gradle|
lang|vde-kotlin|kotlin|Kotlin|apt-get update -y && apt-get install -y kotlin && curl -s "https://get.sdkman.io" | bash && su - devuser -c "source ~/.sdkman/bin/sdkman-init.sh && sdk install kotlin"|
lang|vde-swift|swift|Swift|apt-get update -y && apt-get install -y binutils git libc6-dev curl|
lang|vde-php|php|PHP|apt-get update -y && apt-get install -y php php-cli php-xml php-mbstring php-curl composer|
lang|vde-scala|scala|Scala|apt-get update -y && apt-get install -y scala-defaults sbt|
lang|vde-r|r,rlang|R|apt-get update -y && apt-get install -y r-base r-cran-littler|
lang|vde-lua|lua|Lua|apt-get update -y && apt-get install -y lua5.4 luarocks|
lang|vde-flutter|flutter,dart|Flutter|apt-get update -y && apt-get install -y curl git unzip xz-utils zip libglu1-mesa && su devuser -c 'git clone --depth 1 https://github.com/flutter/flutter.git /home/devuser/flutter && export PATH="$PATH:/home/devuser/flutter/bin" && flutter precache'|
lang|vde-elixir|elixir|Elixir|apt-get update -y && apt-get install -y elixir erlang|
lang|vde-haskell|haskell,ghc|Haskell|apt-get update -y && apt-get install -y ghc cabal-install|
lang|vde-zig|zig|Zig Language|apt-get install -y zig|

# Service VMs (ports 2400-2499)
service|vde-postgres|postgres,postgresql,pg,database|PostgreSQL|apt-get update -y && apt-get install -y postgresql-client|5432
service|vde-redis|redis|Redis|apt-get update -y && apt-get install -y redis-tools|6379
service|vde-mongodb|mongodb,mongo|MongoDB|apt-get update -y && apt-get install -y mongodb-org-shell|27017
service|vde-nginx|nginx|Nginx|apt-get update -y && apt-get install -y nginx-extras|80,443
service|vde-couchdb|couchdb|CouchDB|apt-get update -y && apt-get install -y couchdb|5984
service|vde-mysql|mysql|MySQL|apt-get update -y && apt-get install -y default-mysql-server|3306
service|vde-rabbitmq|rabbitmq|RabbitMQ|apt-get update -y && apt-get install -y erlang-nox && apt-get install -y rabbitmq-server|5672,15672
