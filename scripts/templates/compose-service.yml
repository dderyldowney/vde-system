# Template for service VMs
# Variables: {{NAME}}, {{SSH_PORT}}, {{SERVICE_PORT}}, {{INSTALL_CMD}}
# SERVICE_PORT can be a single port (e.g., "5432") or multiple ports (e.g., "80,443")
name: vde-{{NAME}}
services:
  vde-{{NAME}}:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-{{NAME}}:latest
    container_name: vde-{{NAME}}
    hostname: vde-{{NAME}}
    restart: unless-stopped
    command: sh -c "{{INSTALL_CMD}} && /usr/sbin/sshd -D"

    ports:
      - "{{SSH_PORT}}:22"
      ##SERVICE_PORTS##

    volumes:
      - ../../../data/{{NAME}}:/data
      - ../../../logs/{{NAME}}:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for service VM communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-{{NAME}}.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
