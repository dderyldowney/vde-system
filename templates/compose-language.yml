# VDE ARCHITECTURAL RECORD
# @armor (Spoke Orchestration Blueprint)
# Template for language VMs
# Variables: {{NAME}}, {{SSH_PORT}}, {{PKGS}}, {{CUSTOM_CMD}}
name: vde-{{NAME}}
services:
  vde-{{NAME}}:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: {{NAME}}
        PKGS_TO_INSTALL: "{{PKGS}}"
        CUSTOM_BUILD_CMD: "{{CUSTOM_CMD}}"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-{{NAME}}:latest
    container_name: vde-{{NAME}}
    hostname: vde-{{NAME}}
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name={{NAME}}"

    ports:
      - "{{SSH_PORT}}:{{SSH_PORT}}"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/{{NAME}}:/home/devuser/workspace
      - ../../../../logs/{{NAME}}:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock

    env_file:
      - ../../../../env-files/{{NAME}}.env

    networks:
      vde-net:
        aliases:
          - "{{NAME}}"
          - "vde-{{NAME}}"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
