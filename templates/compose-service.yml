# Template for service VMs
# Variables: {{NAME}}, {{SSH_PORT}}, {{SERVICE_PORT}}, {{INSTALL_CMD}}
# SERVICE_PORT can be a single port (e.g., "5432") or multiple ports (e.g., "80,443")
name: vde-{{NAME}}
services:
  vde-{{NAME}}:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-base.Dockerfile

      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-{{NAME}}:latest
    container_name: vde-{{NAME}}
    hostname: vde-{{NAME}}
    restart: unless-stopped
    # Orchestrate service and SSH startup
    command: >
      sh -c "if [ -n \"{{INSTALL_CMD}}\" ]; then
               {{INSTALL_CMD}};
             fi;
             if [ \"{{NAME}}\" = \"postgres\" ]; then
               chown -R postgres:postgres /var/lib/postgresql/data;
               if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
                 sudo -u postgres /usr/lib/postgresql/15/bin/initdb -D /var/lib/postgresql/data;
                 echo \"host all all all trust\" | sudo -u postgres tee -a /var/lib/postgresql/data/pg_hba.conf >/dev/null;
               fi;
               sudo -u postgres /usr/lib/postgresql/15/bin/pg_ctl -D /var/lib/postgresql/data -o \"-c listen_addresses='*'\" start;
               until pg_isready -q -h localhost -U postgres; do zmodload zsh/zselect 2>/dev/null && zselect -t 20; done;
               sudo -u postgres psql -c \"CREATE ROLE devuser WITH LOGIN SUPERUSER\" 2>/dev/null || true;
             elif [ \"{{NAME}}\" = \"redis\" ]; then
               chown -R devuser:devuser /data;
               sudo -u devuser redis-server --daemonize yes --dir /data --bind 0.0.0.0 --protected-mode no;
               until redis-cli ping >/dev/null 2>&1; do zmodload zsh/zselect 2>/dev/null && zselect -t 20; done;
             elif [ \"{{NAME}}\" = \"mysql\" ]; then
               chown -R mysql:mysql /var/lib/mysql;
               if [ ! -d /var/lib/mysql/mysql ]; then
                 mysqld --initialize-insecure --user=mysql;
               fi;
               mysqld_safe --user=mysql --bind-address=0.0.0.0 --skip-grant-tables &
               until mysqladmin ping -h localhost --silent; do zmodload zsh/zselect 2>/dev/null && zselect -t 20; done;
             fi; 
             /usr/sbin/sshd -D"

    ports:
      - "{{SSH_PORT}}:22"
##SERVICE_PORTS##

    volumes:
      - ../../../../:/vde:ro
      - ../../../../data/{{NAME}}:/data
      - ../../../../logs/{{NAME}}:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      # Persistence mapping
      - ../../../../data/{{NAME}}/pgdata:/var/lib/postgresql/data
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/run/host-services/ssh-auth.sock:ro
      # macOS Canonical Bridge (if exists)
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - REDIS_ARGS=--save 60 1 --loglevel warning

    env_file:
      - ../../../../env-files/vde-{{NAME}}.env

    networks:
      - vde-net

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name={{NAME}}"

    healthcheck:
      test: ["CMD-SHELL", "if [ \"{{NAME}}\" = \"mysql\" ]; then mysqladmin ping -h localhost; elif command -v pg_isready >/dev/null; then pg_isready -U postgres; elif command -v redis-cli >/dev/null; then redis-cli ping; else exit 0; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  vde-net:
    external: true
