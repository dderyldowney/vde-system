# Template for language VMs
# Variables: ruby, 2215, apt-get update -y && apt-get install -y ruby-full
name: vde-ruby
services:
  vde-ruby:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-ruby:latest
    container_name: vde-ruby
    hostname: vde-ruby
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y ruby-full && /usr/sbin/sshd -D"

    ports:
      - "2215:22"

    volumes:
      - ../../../projects/ruby:/home/devuser/workspace
      - ../../../logs/ruby:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-ruby.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
