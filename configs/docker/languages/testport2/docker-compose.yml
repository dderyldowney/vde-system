# Template for language VMs
# Variables: testport2, 2220, 
name: vde-testport2
services:
  vde-testport2:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-base.Dockerfile

      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-testport2:latest
    container_name: vde-testport2
    hostname: vde-testport2
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=testport2"
    command: >
      sh -c "if [ -n \"\" ]; then
               ;
             fi;
             /usr/sbin/sshd -D"

    ports:
      - "2220:22"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/testport2:/home/devuser/workspace
      - ../../../../logs/testport2:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/run/host-services/ssh-auth.sock:ro
      # macOS Canonical Bridge (if exists)
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock

    env_file:
      - ../../../../env-files/vde-testport2.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
