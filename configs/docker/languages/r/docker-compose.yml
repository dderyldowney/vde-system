# Template for language VMs
# Variables: r, 2214, apt-get update -y && apt-get install -y r-base r-cran-littler
name: vde-r
services:
  vde-r:
    build:
      context: ../../..
      dockerfile: configs/docker/r/Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-r:latest
    container_name: vde-r
    hostname: vde-r
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=vde-r"
    command: /usr/sbin/sshd -D

    ports:
      - "2214:22"

    volumes:
      - ../../../../projects/r:/home/devuser/workspace
      - ../../../../logs/r:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-r.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
