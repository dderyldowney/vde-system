# VDE ARCHITECTURAL RECORD
# @armor (Spoke Orchestration Blueprint)
# Template for language VMs
# Variables: displaytest, 2204, , zsh /vde/scripts/setup/displaytest-init.zsh
name: vde-displaytest
services:
  vde-displaytest:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: displaytest
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/displaytest-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-displaytest:latest
    container_name: vde-displaytest
    hostname: vde-displaytest
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=displaytest"

    ports:
      - "2204:2204"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/displaytest:/home/devuser/workspace
      - ../../../../logs/displaytest:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock

    env_file:
      - ../../../../env-files/displaytest.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
