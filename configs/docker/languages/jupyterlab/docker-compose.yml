# VDE ARCHITECTURAL RECORD
# @shared-law (Forge Component)
# Template for language VMs
# Variables: jupyterlab, 2407, python3-pip python3-venv tini, zsh /vde/scripts/setup/jupyterlab-init.zsh
name: vde-jupyterlab
services:
  vde-jupyterlab:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: jupyterlab
        PKGS_TO_INSTALL: "python3-pip python3-venv tini"
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/jupyterlab-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-jupyterlab:latest
    container_name: vde-jupyterlab
    hostname: vde-jupyterlab
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=jupyterlab"

    ports:
      - "2407:2407"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/jupyterlab:/home/devuser/workspace
      - ../../../../logs/jupyterlab:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock

    env_file:
      - ../../../../env-files/jupyterlab.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
