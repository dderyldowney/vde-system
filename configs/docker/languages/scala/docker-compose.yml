# Template for language VMs
# Variables: scala, 2217, apt-get update -y && apt-get install -y scala-defaults sbt
name: vde-scala
services:
  vde-scala:
    build:
      context: ../../..
      dockerfile: configs/docker/scala/Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-scala:latest
    container_name: vde-scala
    hostname: vde-scala
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=vde-scala"
    command: /usr/sbin/sshd -D

    ports:
      - "2217:22"

    volumes:
      - ../../../../projects/scala:/home/devuser/workspace
      - ../../../../logs/scala:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-scala.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
