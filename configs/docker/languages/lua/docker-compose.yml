# Template for language VMs
# Variables: lua, 2212, 
name: vde-lua
services:
  vde-lua:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-base.Dockerfile

      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-lua:latest
    container_name: vde-lua
    hostname: vde-lua
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=lua"
    command: >
      sh -c "if [ -n \"\" ]; then
               ;
             fi;
             /usr/sbin/sshd -D"

    ports:
      - "2212:22"

    volumes:
      - ../../../../projects/lua:/home/devuser/workspace
      - ../../../../logs/lua:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro
      # macOS Canonical Bridge (if exists)
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-lua.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
