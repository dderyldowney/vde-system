# Template for language VMs
# Variables: lua, 2212, , zsh /vde/scripts/setup/lua-init.zsh
name: vde-lua
services:
  vde-lua:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: lua
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/lua-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-lua:latest
    container_name: vde-lua
    hostname: vde-lua
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=lua"
    command: ["/usr/local/bin/vde-entrypoint.zsh"]

    ports:
      - "2212:2212"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/lua:/home/devuser/workspace
      - ../../../../logs/lua:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${SSH_AUTH_SOCK}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock

    env_file:
      - ../../../../env-files/vde-lua.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
