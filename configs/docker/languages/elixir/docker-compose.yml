# VDE ARCHITECTURAL RECORD
# @shared-law (Sovereign Law)
# Template for language VMs
# Variables: elixir, 2206, , zsh /vde/scripts/setup/elixir-init.zsh
name: vde-elixir
services:
  vde-elixir:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: elixir
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/elixir-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-elixir:latest
    container_name: vde-elixir
    hostname: vde-elixir
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=elixir"

    ports:
      - "2206:2206"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/elixir:/home/devuser/workspace
      - ../../../../logs/elixir:/logs
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../.env
      - ../../../../env-files/elixir.env

    networks:
      vde-net:
        aliases:
          - "elixir"
          - "vde-elixir"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
