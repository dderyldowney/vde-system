# VDE ARCHITECTURAL RECORD
# @shared-law (Sovereign Law)
# Template for language VMs
# Variables: python, 2213, , zsh ./scripts/setup/python-init.zsh
name: vde-python
services:
  vde-python:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: python
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh ./scripts/setup/python-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-python:latest
    container_name: vde-python
    hostname: vde-python
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=python"

    ports:
      - "2213:2213"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/python:/home/devuser/workspace
      - ../../../../logs/python:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../env-files/python.env

    networks:
      vde-net:
        aliases:
          - "python"
          - "vde-python"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
