# Template for language VMs
# Variables: php, 2213, , zsh /vde/scripts/setup/php-init.zsh
name: vde-php
services:
  vde-php:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: php
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/php-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-php:latest
    container_name: vde-php
    hostname: vde-php
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=php"
    command: ["/usr/local/bin/vde-entrypoint.zsh"]

    ports:
      - "2213:2213"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/php:/home/devuser/workspace
      - ../../../../logs/php:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${SSH_AUTH_SOCK}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock

    env_file:
      - ../../../../env-files/vde-php.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
