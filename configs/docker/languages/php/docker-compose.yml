# Template for language VMs
# Variables: php, 2213, 
name: vde-php
services:
  vde-php:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-base.Dockerfile

      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-php:latest
    container_name: vde-php
    hostname: vde-php
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=php"
    command: >
      sh -c "if [ -n \"\" ]; then
               ;
             fi;
             /usr/sbin/sshd -D"

    ports:
      - "2213:22"

    volumes:
      - ../../../../projects/php:/home/devuser/workspace
      - ../../../../logs/php:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-php.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
