# VDE ARCHITECTURAL RECORD
# @shared-law (Sovereign Law)
# Template for language VMs
# Variables: swift, 2217, , zsh ./scripts/setup/swift-init.zsh
name: vde-swift
services:
  vde-swift:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: swift
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh ./scripts/setup/swift-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-swift:latest
    container_name: vde-swift
    hostname: vde-swift
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=swift"

    ports:
      - "2217:2217"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/swift:/home/devuser/workspace
      - ../../../../logs/swift:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../env-files/swift.env

    networks:
      vde-net:
        aliases:
          - "swift"
          - "vde-swift"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
