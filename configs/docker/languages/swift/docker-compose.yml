# Template for language VMs
# Variables: swift, 2218, apt-get update -y && apt-get install -y binutils git libc6-dev curl
name: vde-swift
services:
  vde-swift:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-swift:latest
    container_name: vde-swift
    hostname: vde-swift
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=vde-swift"
    command: /usr/sbin/sshd -D

    ports:
      - "2218:22"

    volumes:
      - ../../../../projects/swift:/home/devuser/workspace
      - ../../../../logs/swift:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-swift.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
