# VDE ARCHITECTURAL RECORD
# @shared-law (Sovereign Law)
# Template for language VMs
# Variables: ruby, 2218, , zsh /vde/scripts/setup/ruby-init.zsh
name: vde-ruby
services:
  vde-ruby:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: ruby
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/ruby-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-ruby:latest
    container_name: vde-ruby
    hostname: vde-ruby
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=ruby"

    ports:
      - "2218:2218"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/ruby:/home/devuser/workspace
      - ../../../../logs/ruby:/logs
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../.env
      - ../../../../env-files/ruby.env

    networks:
      vde-net:
        aliases:
          - "ruby"
          - "vde-ruby"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
