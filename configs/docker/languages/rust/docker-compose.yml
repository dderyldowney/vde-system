# Template for language VMs
# Variables: rust, 2216, , zsh /vde/scripts/setup/rust-init.zsh
name: vde-rust
services:
  vde-rust:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: rust
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/rust-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-rust:latest
    container_name: vde-rust
    hostname: vde-rust
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=rust"
    command: ["/usr/local/bin/vde-entrypoint.zsh"]

    ports:
      - "2216:2216"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/rust:/home/devuser/workspace
      - ../../../../logs/rust:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${SSH_AUTH_SOCK}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock

    env_file:
      - ../../../../env-files/vde-rust.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
