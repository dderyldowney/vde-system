# VDE ARCHITECTURAL RECORD
# @shared-law (Sovereign Law)
# Template for language VMs
# Variables: rust, 2219, , zsh /vde/scripts/setup/rust-init.zsh
name: vde-rust
services:
  vde-rust:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: rust
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/rust-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-rust:latest
    container_name: vde-rust
    hostname: vde-rust
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=rust"

    # Docker Socket Sovereignty, cont'd (Issue #457): grant devuser access to
    # the bind-mounted host docker.sock via a launch-time supplementary GID
    # instead of the container ever chown'ing the host socket. Supplied
    # fresh by bin/vde on every ignition -- nothing GID-related is baked
    # into the image itself.
    group_add:
      - "${VDE_DOCKER_SOCK_GID:-1000}"

    ports:
      - "2219:2219"

    volumes:
      - ../../../../:/vde:ro
      - ${VDE_PROJECTS_DIR:-../../../../projects}/rust:/home/devuser/workspace
      - ../../../../logs/rust:/logs
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      # Long form: create_host_path false makes Docker REFUSE a missing agent socket
      # instead of creating a root-owned directory in its place (Signet #618).
      - type: bind
        source: ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}
        target: /run/host-services/ssh-auth.sock
        bind:
          create_host_path: false
      # VDE 2026 Sovereign Bridge
      - type: bind
        source: ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}
        target: /run/vde-ssh.sock
        bind:
          create_host_path: false

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock
      - VDE_AUTHORIZED_KEY=${VDE_AUTHORIZED_KEY:-}
      - POSTGRES_DEV_PASSWORD=${POSTGRES_DEV_PASSWORD:-}

    # The root .env is NOT loaded here (Signet #666): it holds the user's host-side
    # secrets. The two variables above are interpolated from the --env-file that
    # `vde start` passes.
    env_file:
      - ../../../../env-files/rust.env

    networks:
      vde-net:
        aliases:
          - "rust"
          - "vde-rust"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
