# Template for language VMs
# Variables: js, 2209, apt-get update && curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - && apt-get install -y nodejs
name: vde-js
services:
  vde-js:
    build:
      context: ../../..
      dockerfile: configs/docker/js/Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-js:latest
    container_name: vde-js
    hostname: vde-js
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=vde-js"
    command: /usr/sbin/sshd -D

    ports:
      - "2209:22"

    volumes:
      - ../../../../projects/js:/home/devuser/workspace
      - ../../../../logs/js:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-js.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
