# VDE ARCHITECTURAL RECORD
# @shared-law (Forge Component)
# Template for language VMs
# Variables: csharp, 2203, -, zsh /vde/scripts/setup/csharp-init.zsh
name: vde-csharp
services:
  vde-csharp:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: csharp
        PKGS_TO_INSTALL: "-"
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/csharp-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-csharp:latest
    container_name: vde-csharp
    hostname: vde-csharp
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=csharp"

    ports:
      - "2203:2203"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/csharp:/home/devuser/workspace
      - ../../../../logs/csharp:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../env-files/csharp.env

    networks:
      vde-net:
        aliases:
          - "csharp"
          - "vde-csharp"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
