# VDE ARCHITECTURAL RECORD
# @armor (Spoke Orchestration Blueprint)
# Template for language VMs
# Variables: certified-ghost, 2297, htop, zsh /vde/scripts/setup/certified-ghost-init.zsh
name: vde-certified-ghost
services:
  vde-certified-ghost:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: certified-ghost
        PKGS_TO_INSTALL: "htop"
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/certified-ghost-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-certified-ghost:latest
    container_name: vde-certified-ghost
    hostname: vde-certified-ghost
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=certified-ghost"

    ports:
      - "2297:2297"

    volumes:
      - ../../../../:/vde:ro
      - ../../../../projects/certified-ghost:/home/devuser/workspace
      - ../../../../logs/certified-ghost:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/run/vde-ssh.sock

    env_file:
      - ../../../../env-files/certified-ghost.env

    networks:
      vde-net:
        aliases:
          - "certified-ghost"
          - "vde-certified-ghost"

    extra_hosts:
      - "vde-host:host-gateway"
      - "host:host-gateway"

networks:
  vde-net:
    external: true
