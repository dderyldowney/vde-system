# Template for service VMs
# Variables: nginx, 2403, 80,443, apt-get update -y && apt-get install -y nginx-extras
# SERVICE_PORT can be a single port (e.g., "5432") or multiple ports (e.g., "80,443")
name: vde-nginx
services:
  vde-nginx:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-nginx:latest
    container_name: vde-nginx
    hostname: vde-nginx
    restart: unless-stopped
    command: /usr/sbin/sshd -D

    ports:
      - "2403:22"
      - "80:80"
      - "443:443"

    volumes:
      - ../../../../data/nginx:/data
      - ../../../../logs/nginx:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for service VM communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-nginx.env

    networks:
      - vde-net

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name=nginx"

networks:
  vde-net:
    external: true
