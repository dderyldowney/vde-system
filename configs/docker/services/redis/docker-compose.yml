# Template for service VMs
# Variables: redis, 2406, 6379,6380, , zsh /vde/scripts/setup/redis-init.zsh
name: vde-redis
services:
  vde-redis:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: redis
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/redis-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-redis:latest
    container_name: vde-redis
    hostname: vde-redis
    restart: unless-stopped
    command: ["/usr/local/bin/vde-entrypoint.zsh"]

    ports:
      - "2406:2406"
      - "6379:6379"
      - "6380:6380"


    volumes:
      - ../../../../:/vde:ro
      - ../../../../data/redis:/data
      - ../../../../logs/redis:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Persistence mapping
      - ../../../../data/redis/pgdata:/var/lib/postgresql/data
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${SSH_AUTH_SOCK}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - REDIS_ARGS=--save 60 1 --loglevel warning

    env_file:
      - ../../../../env-files/redis.env

    networks:
      - vde-net

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name=redis"

    healthcheck:
      test: ["CMD-SHELL", "if [ \"redis\" = \"mysql\" ]; then mysqladmin ping -h localhost; elif command -v pg_isready >/dev/null; then pg_isready -U postgres; elif command -v redis-cli >/dev/null; then redis-cli ping; else exit 0; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  vde-net:
    external: true
