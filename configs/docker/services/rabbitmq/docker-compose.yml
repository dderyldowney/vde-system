# Template for service VMs
# Variables: rabbitmq, 2405, 5672,15672, apt-get update -y && apt-get install -y erlang-nox && apt-get install -y rabbitmq-server
# SERVICE_PORT can be a single port (e.g., "5432") or multiple ports (e.g., "80,443")
name: vde-rabbitmq
services:
  vde-rabbitmq:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-rabbitmq:latest
    container_name: vde-rabbitmq
    hostname: vde-rabbitmq
    restart: unless-stopped
    command: /usr/sbin/sshd -D

    ports:
      - "2405:22"
      - "5672:5672"
      - "15672:15672"

    volumes:
      - ../../../../data/rabbitmq:/data
      - ../../../../logs/rabbitmq:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for service VM communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-rabbitmq.env

    networks:
      - vde-net

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name=rabbitmq"

networks:
  vde-net:
    external: true
