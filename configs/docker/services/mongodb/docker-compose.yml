# Template for service VMs
# Variables: mongodb, 2401, 27017, , zsh /vde/scripts/setup/mongodb-init.zsh
name: vde-mongodb
services:
  vde-mongodb:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: mongodb
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/mongodb-init.zsh"
        POSTGRES_DEV_PASSWORD: "${POSTGRES_DEV_PASSWORD}"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-mongodb:latest
    container_name: vde-mongodb
    hostname: vde-mongodb
    restart: unless-stopped

    ports:
      - "2401:2401"
      - "27017:27017"


    volumes:
      - ../../../../:/vde:ro
      - ../../../../data/mongodb:/data
      - ../../../../logs/mongodb:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Persistence mapping
      - ../../../../data/mongodb/pgdata:/var/lib/postgresql/data
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${VDE_HOST_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - REDIS_ARGS=--save 60 1 --loglevel warning

    env_file:
      - ../../../../env-files/mongodb.env

    networks:
      - vde-net

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name=mongodb"

    healthcheck:
      test: ["CMD-SHELL", "if [ \"mongodb\" = \"mysql\" ]; then mysqladmin ping -h localhost; elif command -v pg_isready >/dev/null; then pg_isready -U postgres; elif command -v redis-cli >/dev/null; then redis-cli ping; else exit 0; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  vde-net:
    external: true
