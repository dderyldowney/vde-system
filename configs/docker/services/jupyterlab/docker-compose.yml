# Template for service VMs
# Variables: jupyterlab, 2407, 8888, , zsh /vde/scripts/setup/jupyterlab-init.zsh
name: vde-jupyterlab
services:
  vde-jupyterlab:
    build:
      context: ../../../..
      dockerfile: configs/docker/vde-lang.Dockerfile
      args:
        VM_NAME: jupyterlab
        PKGS_TO_INSTALL: ""
        CUSTOM_BUILD_CMD: "zsh /vde/scripts/setup/jupyterlab-init.zsh"
        USERNAME: devuser
        UID: 1000
        GID: 1000
    image: vde-jupyterlab:latest
    container_name: vde-jupyterlab
    hostname: vde-jupyterlab
    restart: unless-stopped

    ports:
      - "2407:2407"
      - "8888:8888"


    volumes:
      - ../../../../:/vde:ro
      - ../../../../data/jupyterlab:/data
      - ../../../../logs/jupyterlab:/logs
      - ~/.ssh/vde/vde_student.pub:/home/devuser/.ssh/vde/authorized_keys:ro
      - ~/.ssh/vde/vde_student:/home/devuser/.ssh/vde/vde_student:ro
      # Persistence mapping
      - ../../../../data/jupyterlab/pgdata:/var/lib/postgresql/data
      # Docker Socket Sovereignty (Physical Verification Law)
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Canonical Bridge (Hardened to use explicit host socket)
      - ${SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
      # VDE 2026 Sovereign Bridge
      - ${SSH_AUTH_SOCK}:/run/vde-ssh.sock

    environment:
      - SSH_AUTH_SOCK=/home/devuser/.ssh/vde/agent.sock
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - REDIS_ARGS=--save 60 1 --loglevel warning

    env_file:
      - ../../../../env-files/jupyterlab.env

    networks:
      - vde-net

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name=jupyterlab"

    healthcheck:
      test: ["CMD-SHELL", "if [ \"jupyterlab\" = \"mysql\" ]; then mysqladmin ping -h localhost; elif command -v pg_isready >/dev/null; then pg_isready -U postgres; elif command -v redis-cli >/dev/null; then redis-cli ping; else exit 0; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  vde-net:
    external: true
