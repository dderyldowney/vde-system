# Template for service VMs
# Variables: couchdb, 2400, 5984, apt-get update -y && apt-get install -y couchdb
# SERVICE_PORT can be a single port (e.g., "5432") or multiple ports (e.g., "80,443")
name: vde-couchdb
services:
  vde-couchdb:
    build:
      context: ../../..
      dockerfile: configs/docker/couchdb/Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-couchdb:latest
    container_name: vde-couchdb
    hostname: vde-couchdb
    restart: unless-stopped
    command: /usr/sbin/sshd -D

    ports:
      - "2400:22"
      - "5984:5984"

    volumes:
      - ../../../../data/couchdb:/data
      - ../../../../logs/couchdb:/logs
      - ../../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for service VM communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../../env-files/vde-couchdb.env

    networks:
      - vde-net

    labels:
      - "vde.managed=true"
      - "vde.type=service"
      - "vde.name=couchdb"

networks:
  vde-net:
    external: true
