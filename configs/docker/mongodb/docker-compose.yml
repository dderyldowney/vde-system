services:
  mongodb:
    build:
      context: ../../..
      dockerfile: configs/docker/base-dev.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: dev-mongodb:latest
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y mongodb-org-shell && /usr/sbin/sshd -D"

    ports:
      - "2402:22"
      - "27017:27017"

    volumes:
      - ../../../data/mongodb:/data
      - ../../../logs/mongodb:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for service VM communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/mongodb.env

    networks:
      - dev-net

networks:
  dev-net:
    external: true
