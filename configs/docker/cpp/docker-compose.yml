# Template for language VMs
# Variables: cpp, 2202, apt-get update -y && apt-get install -y g++ make cmake gdb
name: vde-cpp
services:
  vde-cpp:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-cpp:latest
    container_name: vde-cpp
    hostname: vde-cpp
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=vde-cpp"
    command: sh -c "apt-get update -y && apt-get install -y g++ make cmake gdb && /usr/sbin/sshd -D"

    ports:
      - "2202:22"

    volumes:
      - ../../../projects/cpp:/home/devuser/workspace
      - ../../../logs/cpp:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-cpp.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
