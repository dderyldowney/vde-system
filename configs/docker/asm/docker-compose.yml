services:
  vde-asm:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: dev-asm:latest
    container_name: vde-asm
    hostname: vde-asm
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y nasm yasm gdb && /usr/sbin/sshd -D"

    ports:
      - "2202:22"

    volumes:
      - ../../../projects/asm:/home/devuser/workspace
      - ../../../logs/asm:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-asm.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
