# Template for service VMs
# Variables: postgres, 2401, 5432, apt-get update -y && apt-get install -y postgresql-client
# SERVICE_PORT can be a single port (e.g., "5432") or multiple ports (e.g., "80,443")
services:
  postgres:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-postgres:latest
    container_name: vde-postgres
    hostname: postgres
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y postgresql-client && /usr/sbin/sshd -D"

    ports:
      - "2401:22"
      - "5432:5432"

    volumes:
      - ../../../data/postgres:/data
      - ../../../logs/postgres:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for service VM communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/postgres.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
