# Template for language VMs
# Variables: testlang, 2299, apt-get install -y curl
name: vde-testlang
services:
  vde-testlang:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-testlang:latest
    container_name: vde-testlang
    hostname: vde-testlang
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=testlang"
    command: sh -c "apt-get install -y curl && /usr/sbin/sshd -D"

    ports:
      - "2299:22"

    volumes:
      - ../../../projects/testlang:/home/devuser/workspace
      - ../../../logs/testlang:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-testlang.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
