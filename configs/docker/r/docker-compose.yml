# Template for language VMs
# Variables: r, 2201, apt-get update -y && apt-get install -y r-base r-cran-littler
services:
  vde-r:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: dev-r:latest
    container_name: vde-r
    hostname: vde-r
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y r-base r-cran-littler && /usr/sbin/sshd -D"

    ports:
      - "2201:22"

    volumes:
      - ../../../projects/r:/home/devuser/workspace
      - ../../../logs/r:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-r.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
