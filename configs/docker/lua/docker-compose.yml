# Template for language VMs
# Variables: lua, 2211, apt-get update -y && apt-get install -y lua5.4 luarocks
name: vde-lua
services:
  vde-lua:
    build:
      context: ../../..
      dockerfile: configs/docker/lua/Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-lua:latest
    container_name: vde-lua
    hostname: vde-lua
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=vde-lua"
    command: /usr/sbin/sshd -D

    ports:
      - "2211:22"

    volumes:
      - ../../../projects/lua:/home/devuser/workspace
      - ../../../logs/lua:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-lua.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
