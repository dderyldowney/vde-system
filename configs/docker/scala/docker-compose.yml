services:
  vde-scala:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
    image: vde-scala:latest
    container_name: vde-scala
    hostname: vde-scala
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y scala-defaults sbt && /usr/sbin/sshd -D"

    ports:
      - "2213:22"

    volumes:
      - ../../../projects/scala:/home/devuser/workspace
      - ../../../logs/scala:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock
      - VDE_HOME=${VDE_HOME:-}
      - VDE_PROJECT_NAME=${VDE_PROJECT_NAME:-}

    env_file:
      - ../../../env-files/vde-vde-scala.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
