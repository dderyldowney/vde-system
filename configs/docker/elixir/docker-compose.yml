# Template for language VMs
# Variables: elixir, 2215, apt-get update -y {{INSTALL_CMD}}{{INSTALL_CMD}} apt-get install -y elixir erlang
services:
  vde-elixir:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
    image: vde-elixir:latest
    container_name: vde-elixir
    hostname: vde-elixir
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y elixir erlang && /usr/sbin/sshd -D"

    ports:
      - "2215:22"

    volumes:
      - ../../../projects/elixir:/home/devuser/workspace
      - ../../../logs/elixir:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock
      - VDE_HOME=${VDE_HOME:-}
      - VDE_PROJECT_NAME=${VDE_PROJECT_NAME:-}

    env_file:
      - ../../../env-files/vde-vde-elixir.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
