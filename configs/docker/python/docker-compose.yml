# Template for language VMs
# Variables: python, 2213, apt-get update -y && apt-get install -y python3 python3-pip
name: vde-python
services:
  vde-python:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-python:latest
    container_name: vde-python
    hostname: vde-python
    restart: unless-stopped
    command: sh -c "apt-get update -y && apt-get install -y python3 python3-pip && /usr/sbin/sshd -D"

    ports:
      - "2213:22"

    volumes:
      - ../../../projects/python:/home/devuser/workspace
      - ../../../logs/python:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-python.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
