# Template for language VMs
# Variables: kotlin, 2210, apt-get update -y && apt-get install -y kotlin && curl -s "https://get.sdkman.io" | bash && su - devuser -c "source ~/.sdkman/bin/sdkman-init.sh && sdk install kotlin"
name: vde-kotlin
services:
  vde-kotlin:
    build:
      context: ../../..
      dockerfile: configs/docker/vde-base.Dockerfile
      args:
        USERNAME: devuser
        UID: 1000
        GID: 1000
        PUBLIC_KEYS_DIR: /public-ssh-keys
    image: vde-kotlin:latest
    container_name: vde-kotlin
    hostname: vde-kotlin
    restart: unless-stopped
    labels:
      - "vde.managed=true"
      - "vde.type=lang"
      - "vde.name=vde-kotlin"
    command: sh -c "apt-get update -y && apt-get install -y kotlin && curl -s "https://get.sdkman.io" | bash && su - devuser -c "source ~/.sdkman/bin/sdkman-init.sh && sdk install kotlin" && /usr/sbin/sshd -D"

    ports:
      - "2210:22"

    volumes:
      - ../../../projects/kotlin:/home/devuser/workspace
      - ../../../logs/kotlin:/logs
      - ../../../public-ssh-keys:/public-ssh-keys:ro
      # SSH agent forwarding for VM->VM, VM->Host, VM->External communication
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent/sock:ro

    environment:
      - SSH_AUTH_SOCK=/ssh-agent/sock

    env_file:
      - ../../../env-files/vde-kotlin.env

    networks:
      - vde-net

networks:
  vde-net:
    external: true
