# Test policy numbers.
# @forge (Governance Sentinel)
# This file holds the machine-readable numbers of docs/development/testing.md,
# the single source of truth for how we test. The document states the same
# values, and tests/unit/testing-policy-wiring.test.zsh pins that they match
# each other and that the tooling defaults match.
# Budgets only ever go DOWN, never up.

# Seconds the unit suite may take before it is considered over budget.
UNIT_SUITE_BUDGET_SECONDS=150
# Seconds the full certification tier may take before it is over budget.
FULL_TIER_BUDGET_SECONDS=1500
# Seconds a proof-of-life stamp stays valid. Equals the default of VDE_POL_STAMP_TTL in lib/vde-pol-stamp.
STAMP_TTL_SECONDS=1800
# Seconds to wait on the Docker events stream. Equals the default of VDE_DOCKER_EVENTS_TIMEOUT in tests/run-sovereign-tests.zsh.
DOCKER_EVENTS_TIMEOUT_SECONDS=10
# Maximum number of running Spokes. This is Rule K: this machine's tested maximum, never raised.
MAX_RUNNING_SPOKES=3
# Maximum number of unit suites the Sovereign runner runs at once. This is the measured maximum, never raised without a new measurement. Equals VDE_MAX_TEST_JOBS in tests/run-sovereign-tests.zsh.
TEST_PARALLEL_JOBS=4
# Whether a failed test is rerun once to detect flakiness (1 = yes, 0 = no).
FLAKE_RERUN_ON_FAIL=1
# Number of recent runs considered when judging flakiness.
FLAKE_WINDOW_RUNS=20
# Number of failures within the window at which a test is treated as flaky.
FLAKE_FAIL_THRESHOLD=3
