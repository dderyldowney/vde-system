[behave]
show_skipped = True
paths = tests/features/core-infrastructure
tags = core-suite and not wip
verbose = False
capture = True
capture_stderr = True
# === Tag Taxonomy ===
# @core-suite               = membership marker: this feature belongs to the core test suite
# @core-infrastructure      = feature runs without a live Docker daemon
# @unit                     = pure in-process tests; persistent zsh parser process started
# @integration              = needs VDE network initialised (vde init --networks-only)
# @docker                   = entire feature requires Docker; containers torn down after feature
# @requires-docker-host     = scenario needs a running Docker daemon (skipped in CI/offline)
# @requires-docker-ssh      = scenario writes ~/.ssh/vde/ files; dir is backed up/restored
# @requires-ssh-agent       = scenario interacts with SSH keys; dir is backed up/restored
# @wip                      = work-in-progress (excluded from default run)
# === Suite Paths ===
# tests/features/core-infrastructure  = core suite (this file)
# tests/features/deferred/            = old tests being cherry-picked; NEVER added to paths
# === Running Specific Suites ===
# Default (core suite):  python3 -m behave
# WIP only:              behave --wip tests/features/core-infrastructure/
# Docker only:           python3 -m behave --tags=docker
# Add new suite:         append path to 'paths' above and tag features with @core-suite (or new suite tag)
