[behave]
show_skipped = True
paths = tests/features/core-infrastructure
tags = core-infrastructure and not requires-docker-host
# @core-infrastructure = any test that runs without a live Docker daemon
# @requires-docker-host = scenario needs a running Docker daemon (skipped in CI/offline)
# @docker = feature-level: entire feature requires Docker
# To run WIP tests: behave --wip tests/features/
# To run Docker tests: behave --tags=@docker tests/features/core-infrastructure/
