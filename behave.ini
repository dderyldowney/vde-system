[behave]
show_skipped = True
paths = tests/features/core-infrastructure
tags = not docker and not requires-docker-host
# Note: Tests marked with @wip (work in progress) are skipped by behave by default
# To run WIP tests, use: behave --wip tests/features/
# To exclude WIP tests entirely, use: behave --no-skipped tests/features/
# To include Docker tests: behave --tags=@docker
