name: Paired Update Check
on:
  push:
  pull_request:
  workflow_dispatch:

# Enforce zsh as the default shell for all jobs and steps
defaults:
  run:
    shell: zsh {0}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
      - name: Sovereign Audit (Rule A)
        shell: zsh {0}
        run: ./bin/vde-enforce-uap.zsh
      - name: Run paired update enforcer
        shell: zsh {0}
        run: |
          ./bin/paired_update_enforcer
          echo "Paired update check passed."
