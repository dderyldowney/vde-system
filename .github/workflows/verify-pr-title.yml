# VDE ARCHITECTURAL RECORD
# @shared-law (CI/CD Sovereign Workflow)
name: Verify PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronized

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits Check
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure which types are allowed.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Configure that a scope must always be provided.
          requireScope: false
          # Configure that a scope must be one of the following.
          # scopes: |
          #   core
          #   cli
          #   docs
          #   deps
          # Configure that the title must not end with a dot.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject abbreviation (the part after the colon) must not start with an uppercase letter.
