---
name: VDE CI Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:
    inputs:
      specific_vm:
        description: 'Specific VM to test (e.g., python, postgres, go, redis)'
        required: false
        type: string

# Enforce zsh as the default shell for all jobs and steps
defaults:
  run:
    shell: zsh {0}

env:
  VDE_ROOT_DIR: ${{ github.workspace }}

jobs:
  # =============================================================================
  # Job 1: Linting
  # =============================================================================
  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
          wget -qO- "https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64" > shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/bin/
          pip install ruff yamllint

      - name: Sovereign Audit (Rule A)
        shell: zsh {0}
        run: bin/vde-enforce-uap.zsh

      - name: Run zsh syntax check
        shell: zsh {0}
        run: |
          echo "Checking zsh script syntax..."
          for file in $(find bin lib scripts tests -type f \( -name "*.zsh" -o ! -name "*.*" \)); do
            if head -1 "$file" | grep -q "zsh"; then
              # Skip files known to have non-compliant syntax for zsh -n (e.g. emoji, legacy)
              if [[ "$file" != *"test-e2e-user-journey.zsh" ]]; then
                zsh -n "$file" || { echo "Syntax error in: $file"; exit 1; }
              fi
            fi
          done
          echo "✓ All zsh scripts passed syntax check"

      - name: Run yamllint
        shell: bash
        run: yamllint .github/workflows/ configs/docker/*/docker-compose.yml || true

      - name: Run ruff Python linter
        shell: zsh {0}
        run: |
          echo "Running ruff on Python files..."
          ruff check tests/ --output-format=github
          echo "✓ Ruff check passed"

  # =============================================================================
  # Job 2: Sovereign Tests (CI-Safe)
  # =============================================================================
  sovereign-tests:
    name: Sovereign Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh jq && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Run Sovereign Test Runner
        shell: zsh {0}
        run: |
          chmod +x tests/run-sovereign-tests.zsh
          ./tests/run-sovereign-tests.zsh

  # =============================================================================
  # Job 3: Code Coverage
  # =============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq cmake libcurl4-openssl-dev libelf-dev libdw-dev binutils-dev
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Sovereign Audit (Rule A)
        shell: zsh {0}
        run: bin/vde-enforce-uap.zsh

      - name: Install kcov
        shell: zsh {0}
        run: |
          git clone https://github.com/SimonKagstrom/kcov.git
          cd kcov
          cmake .
          make
          sudo make install
          cd ..
          rm -rf kcov

      - name: Run tests with coverage
        shell: zsh {0}
        run: |
          chmod +x bin/coverage.zsh
          ./bin/coverage.zsh all

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/merged/
          retention-days: 30

  # =============================================================================
  # Job 4: Sovereign Image Build (Hub-and-Spoke Lifecycle)
  # =============================================================================
  image-build:
    name: Build Sovereign Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Sovereign Audit (Rule A)
        shell: zsh {0}
        run: bin/vde-enforce-uap.zsh

      - name: Generate Test Identity
        shell: zsh {0}
        run: |
          mkdir -p ~/.ssh/vde
          ssh-keygen -t ed25519 -f ~/.ssh/vde/vde_student -N "" -C "ci-test"
          chmod 600 ~/.ssh/vde/vde_student

      - name: Build VDE-BASE (The Hub)
        shell: zsh {0}
        run: bin/vde rebuild --vm base

      - name: Build VDE-LANG (Sample Spoke: Python)
        shell: zsh {0}
        run: bin/vde rebuild --vm python

      - name: Build VDE-SERVICE (Sample Spoke: Redis)
        shell: zsh {0}
        run: bin/vde rebuild --vm redis

  # =============================================================================
  # Job 5: Summary
  # =============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, sovereign-tests, coverage, image-build]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh jq && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Sovereign Audit (Rule A)
        shell: zsh {0}
        run: bin/vde-enforce-uap.zsh

      - name: Display CI Summary
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.sovereign-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.image-build.result }}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║          VDE CI Pipeline - Execution Summary                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Job Results:"
          echo "  ┌─ Linting: $LINT_RESULT"
          echo "  ├─ Sovereign Tests: $TEST_RESULT"
          echo "  ├─ Code Coverage: $COVERAGE_RESULT"
          echo "  └─ Image Builds: $BUILD_RESULT"
          echo ""
          echo "  Note: Container-required tests (DinD) are skipped in CI."
          echo "  Run 'make test-docker' locally for full lifecycle verification."

          if [[ "$LINT_RESULT" == "failure" ]] || \
             [[ "$TEST_RESULT" == "failure" ]] || \
             [[ "$COVERAGE_RESULT" == "failure" ]] || \
             [[ "$BUILD_RESULT" == "failure" ]]; then
            echo "::error::CI Pipeline Failed"
            exit 1
          else
            echo "::notice::CI Pipeline Passed ✓"
          fi
